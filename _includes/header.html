<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/conferences/' | relative_url }}"{% if page.url == '/conferences/' %} aria-current="page"{% endif %}>Conferences</a>
      <a href="{{ site.author.cv | relative_url }}">CV</a>
    </nav>
  </div>
</header>
